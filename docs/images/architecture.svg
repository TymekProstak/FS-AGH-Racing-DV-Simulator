<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">AGH Racing DV Simulator architecture</title>
  <desc id="desc">Implemented command, vehicle, sensor, VCU, DV-board and ROS data flow.</desc>
  <defs>
    <marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#26332e"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#168a55"/>
    </marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#17211d}
      .title{font-size:28px;font-weight:650}
      .subtitle{font-size:13px;fill:#65726c}
      .section{font-size:12px;font-weight:700;letter-spacing:1.4px;fill:#168a55}
      .label{font-size:14px;font-weight:650}
      .small{font-size:11px;fill:#5e6c65}
      .topic{font:11px "SFMono-Regular",Consolas,monospace;fill:#26332e}
      .type{font:10px "SFMono-Regular",Consolas,monospace;fill:#738078}
      .box{fill:#fff;stroke:#aab5b0;stroke-width:1.35}
      .accent{fill:#f4faf7;stroke:#168a55;stroke-width:1.65}
      .group{fill:#fbfcfb;stroke:#68766f;stroke-width:1.35}
      .command{fill:none;stroke:#26332e;stroke-width:1.55;marker-end:url(#arrow-dark)}
      .feedback{fill:none;stroke:#168a55;stroke-width:1.6;marker-end:url(#arrow-green)}
      .bus{fill:none;stroke:#168a55;stroke-width:1.3}
      .state{fill:none;stroke:#168a55;stroke-width:1.25}
      .state-arrow{fill:none;stroke:#168a55;stroke-width:1.25;marker-end:url(#arrow-green)}
    </style>
  </defs>

  <rect width="1400" height="800" fill="#fff"/>
  <text x="48" y="43" class="title">AGH Racing DV Simulator</text>
  <text x="48" y="67" class="subtitle">Implemented runtime architecture and data flow</text>
  <line x1="48" y1="84" x2="1352" y2="84" stroke="#d7ddda"/>

  <text x="48" y="111" class="section">AUTONOMOUS PIPELINE</text>
  <g>
    <rect x="48" y="128" width="190" height="62" rx="7" class="box"/>
    <text x="143" y="154" text-anchor="middle" class="label">Cone perception</text>
    <text x="143" y="176" text-anchor="middle" class="small">camera · lidar · fusion</text>

    <rect x="298" y="128" width="190" height="62" rx="7" class="box"/>
    <text x="393" y="154" text-anchor="middle" class="label">SLAM</text>
    <text x="393" y="176" text-anchor="middle" class="small">global cone map</text>

    <rect x="548" y="128" width="190" height="62" rx="7" class="box"/>
    <text x="643" y="154" text-anchor="middle" class="label">Path planning</text>
    <text x="643" y="176" text-anchor="middle" class="small">centerline · target path</text>

    <rect x="810" y="128" width="190" height="62" rx="7" class="accent"/>
    <text x="905" y="154" text-anchor="middle" class="label">Control</text>
    <text x="905" y="176" text-anchor="middle" class="small">steering · torque request</text>

    <path d="M238 159H298" class="command"/>
    <path d="M488 159H548" class="command"/>
    <path d="M738 159H810" class="command"/>
  </g>

  <rect x="65" y="236" width="1300" height="535" rx="10" class="group"/>
  <rect x="90" y="224" width="190" height="24" fill="#fff"/>
  <text x="100" y="242" class="section">SIMULATOR RUNTIME</text>

  <!-- Black paths are ROS/command traffic; green paths are timed runtime samples. -->
  <rect x="1015" y="224" width="325" height="24" fill="#fff"/>
  <path d="M1030 237H1060" class="command"/>
  <text x="1070" y="242" class="small">ROS messages</text>
  <path d="M1180 237H1210" class="feedback"/>
  <text x="1220" y="242" class="small">timed samples</text>

  <!-- Control commands enter the DV board; its outgoing feedback returns through ROS. -->
  <path d="M930 190V290" class="command"/>
  <path d="M1090 320H1140V150H1000" class="command"/>

  <!-- Implemented command path: DV board -> VCU -> mode routing -> dynamics. -->
  <g>
    <rect x="100" y="290" width="240" height="90" rx="7" class="accent"/>
    <text x="220" y="316" text-anchor="middle" class="label">Vehicle dynamics</text>
    <text x="220" y="338" text-anchor="middle" class="small">double-track · MF6.1 tyres</text>
    <text x="220" y="356" text-anchor="middle" class="small">suspension · drivetrain · steering</text>

    <rect x="390" y="290" width="190" height="90" rx="7" class="box"/>
    <text x="485" y="316" text-anchor="middle" class="label">Mode routing</text>
    <text x="485" y="338" text-anchor="middle" class="small">ONE_WHEEL: allocation + TV</text>
    <text x="485" y="356" text-anchor="middle" class="small">FOUR_WHEEL: direct torques</text>

    <rect x="630" y="290" width="210" height="90" rx="7" class="box"/>
    <text x="735" y="316" text-anchor="middle" class="label">VCU / main-board unit</text>
    <text x="735" y="338" text-anchor="middle" class="small">main loop timer · sampled inputs</text>
    <text x="735" y="356" text-anchor="middle" class="small">computation delay queue</text>

    <rect x="890" y="290" width="200" height="90" rx="7" class="box"/>
    <text x="990" y="316" text-anchor="middle" class="label">DV Board</text>
    <text x="990" y="338" text-anchor="middle" class="small">control cache · input sampling</text>
    <text x="990" y="356" text-anchor="middle" class="small">motor command · feedback bridge</text>

    <path d="M890 320H840" class="command"/>
    <path d="M630 320H580" class="command"/>
    <path d="M390 320H340" class="command"/>

    <path d="M840 351H890" class="feedback"/>
    <text x="865" y="370" text-anchor="middle" class="small">feedback</text>
  </g>

  <text x="100" y="416" class="section">SAMPLED DEVICES</text>

  <!-- State-estimator data goes directly to Control; IMU samples feed the VCU. -->
  <path d="M410 480V420H1240V168H1000" class="command"/>
  <path d="M640 480V430H680V380" class="feedback"/>

  <!-- Encoder samples go to the VCU, then through the DV-board feedback path. -->
  <path d="M870 480V455H810V380" class="feedback"/>
  <path d="M1100 480V455H870" class="bus"/>

  <g>
    <rect x="100" y="480" width="170" height="72" rx="7" class="box"/>
    <text x="185" y="506" text-anchor="middle" class="label">Perception</text>
    <text x="185" y="528" text-anchor="middle" class="small">camera · lidar · fusion timers</text>

    <rect x="320" y="480" width="180" height="72" rx="7" class="box"/>
    <text x="410" y="506" text-anchor="middle" class="label">State estimator</text>
    <text x="410" y="528" text-anchor="middle" class="small">timer · noise · bias · delay</text>

    <rect x="550" y="480" width="180" height="72" rx="7" class="box"/>
    <text x="640" y="506" text-anchor="middle" class="label">IMU</text>
    <text x="640" y="528" text-anchor="middle" class="small">accelerometer + gyro clocks</text>

    <rect x="780" y="480" width="180" height="72" rx="7" class="box"/>
    <text x="870" y="506" text-anchor="middle" class="label">Wheel encoder</text>
    <text x="870" y="528" text-anchor="middle" class="small">independent sample timer</text>

    <rect x="1010" y="480" width="180" height="72" rx="7" class="box"/>
    <text x="1100" y="506" text-anchor="middle" class="label">Steering encoder</text>
    <text x="1100" y="528" text-anchor="middle" class="small">noise · independent timer</text>
  </g>

  <!-- Perception output returns to the first block of the autonomous stack. -->
  <path d="M100 516H30V159H48" class="command"/>

  <!-- True vehicle state is sampled independently by each simulated device. -->
  <path d="M100 350H80V650H1100" class="state"/>
  <path d="M185 650V552" class="state-arrow"/>
  <path d="M410 650V552" class="state-arrow"/>
  <path d="M640 650V552" class="state-arrow"/>
  <path d="M870 650V552" class="state-arrow"/>
  <path d="M1100 650V552" class="state-arrow"/>
  <text x="100" y="642" class="small">true vehicle state</text>

  <line x1="100" y1="687" x2="1358" y2="687" stroke="#d7ddda"/>
  <text x="100" y="716" class="section">RUNTIME AND ROS INTERFACES</text>
  <text x="100" y="742" class="topic">PeriodicTimer · ValueCache · DelayedQueue · runtime JSON parameters</text>
  <text x="605" y="716" class="type">dv_interfaces/Control · dv_interfaces/Imu · dv_interfaces/DV_board</text>
  <text x="605" y="742" class="type">dv_interfaces/Cones · nav_msgs/Odometry · std_msgs/Float64</text>
</svg>
